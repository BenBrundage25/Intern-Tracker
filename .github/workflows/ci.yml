name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jobmatcher
          POSTGRES_PASSWORD: jobmatcher
          POSTGRES_DB: jobmatcher
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobmatcher"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://jobmatcher:jobmatcher@localhost:5432/jobmatcher
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest -q
      - name: Migrations apply and roll back cleanly
        run: |
          uv run alembic -c backend/alembic.ini upgrade head
          uv run alembic -c backend/alembic.ini downgrade base
          uv run alembic -c backend/alembic.ini upgrade head
      - name: ETL smoke test (load twice; second run must insert nothing)
        run: |
          csv=etl/tests/fixtures/sample_postings.csv
          uv run etl/load.py --csv "$csv" --background-rate 0 | tee first.txt
          uv run etl/load.py --csv "$csv" --background-rate 0 | tee second.txt
          grep -Eq '^inserted +3$' first.txt
          grep -Eq '^inserted +0$' second.txt
