[project]
name = "internship-tracker"
version = "0.1.0"
description = "Matches resumes to internship postings using hybrid search."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Installs `app` (the backend package) and `etl` so both are importable from
# scripts, tests, and Alembic without sys.path hacks.
packages = ["backend/app", "etl"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "etl/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "etl"]
